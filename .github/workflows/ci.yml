# Builds the solution and runs both test projects on every push and pull request.
# The app is WPF, so it needs a Windows runner.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    # Actions are pinned to exact commits (version in the comment), so a moved tag cannot change what runs here.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build RAV4ControlStudio.slnx -c Release

      - name: Test
        run: dotnet test RAV4ControlStudio.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
